  <!-- Prevent theme flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('portfolio-theme') || 'crimson-light';
        document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('portfolio-lang') || 'en';
        document.documentElement.setAttribute('lang', l);
      } catch (e) {}
    })();
  </script>
